openapi: 3.0.3
info:
  title: DROIN API
  version: 0.2.0
  description: >-
    Personal finance API. Every endpoint except /health, /auth/register and /auth/login needs
    `Authorization: Bearer <token>` (get the token from register/login, then use the Authorize button).


    **Retries:** send an `Idempotency-Key` header (e.g. a UUID made when the user taps Save) on POST
    requests. Retrying with the same key returns the first response instead of doing the action twice.


    **Money:** amounts are numbers with at most 2 decimals. Dates are `YYYY-MM-DD`, months `YYYY-MM`.
    "Today" and "this month" are taken in the user's timezone.
servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Wallets
    description: Balances only change through transactions. Archive a wallet to hide it but keep its history.
  - name: Categories
    description: New accounts get default categories with icon and color. System categories (system_key) are re-created if deleted.
  - name: Transactions
    description: >-
      Income/expense. Create/edit/delete updates the wallet balance in the same DB transaction.
      Transactions with origin transfer/transfer_fee/debt can only be changed through their transfer or debt.
  - name: Attachments
    description: Receipt photos/PDFs (max 5 MB; jpeg, png, webp, heic, pdf).
  - name: Transfers
    description: >-
      Moving money between own wallets: 2 transactions without a category (not income/expense) plus an
      optional admin fee, recorded as an expense in the "Admin Fees" category.
  - name: Reports
    description: Transfer legs and debt movements are NOT counted as income/expense.
  - name: Budgets
  - name: Recurring
  - name: Goals
  - name: Debts
  - name: Tags
  - name: Insights
  - name: Quick input
  - name: Export
  - name: Sync
  - name: Notifications

paths:
  /health:
    get:
      summary: Check the API and the database connection
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  dbTime: { type: string, format: date-time }

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account (with default categories) and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, example: me@example.com }
                password: { type: string, minLength: 8, example: password123 }
                name: { type: string, example: Nindya }
                timezone: { type: string, default: Asia/Jakarta }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Auth]
      summary: Update name, email or timezone (omitted fields stay the same)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                timezone: { type: string, example: Asia/Makassar }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/password:
    put:
      tags: [Auth]
      summary: Change password (logs out all other devices)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------------------------------------------------------------- Wallets
  /wallets:
    get:
      tags: [Wallets]
      summary: List wallets
      parameters:
        - $ref: "#/components/parameters/IncludeArchived"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Wallet" } } } } }
    post:
      tags: [Wallets]
      summary: Create a wallet
      description: opening_balance is recorded as an income in the "Opening Balance" category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WalletInput"
                - type: object
                  properties:
                    opening_balance: { type: number, example: 1500000 }
                    opening_date: { type: string, format: date, description: "Default: today" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /wallets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Wallets]
      summary: Wallet detail
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Wallets]
      summary: Update name, type, icon and color
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WalletInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Wallets]
      summary: Delete a wallet without history (otherwise 409 — archive it instead)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallets/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Wallets]
      summary: Archive (hide, keep history, refuse new transactions)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
  /wallets/{id}/unarchive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Wallets]
      summary: Unarchive
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }

  # ---------------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TransactionType" } }
        - $ref: "#/components/parameters/IncludeArchived"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } } } }
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /categories/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Categories]
      summary: Category detail
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Categories]
      summary: Update a category (type cannot change once used)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Categories]
      summary: Delete an unused category (otherwise 409 — archive it instead)
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [Categories], summary: Archive, responses: { "200": { description: OK } } }
  /categories/{id}/unarchive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [Categories], summary: Unarchive, responses: { "200": { description: OK } } }

  # ---------------------------------------------------------------- Transactions
  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions (newest first)
      description: The total number of matches is in the `X-Total-Count` response header.
      parameters:
        - { name: wallet_id, in: query, schema: { type: integer } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TransactionType" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: Search in note and category name, schema: { type: string } }
        - { name: tag, in: query, description: Tag name, schema: { type: string } }
        - { name: origin, in: query, schema: { type: string, enum: [manual, transfer, transfer_fee, debt] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          headers: { X-Total-Count: { schema: { type: integer } } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } } } }
    post:
      tags: [Transactions]
      summary: Create an income/expense
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransactionInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /transactions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Transactions]
      summary: Transaction detail
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Transactions]
      summary: Replace a transaction (omit tags to keep them, [] to clear)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransactionInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Transactions]
      summary: Delete a transaction (and its receipts)
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }
  /transactions/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Attachments]
      summary: List receipts of a transaction
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Attachment" } } } } }
    post:
      tags: [Attachments]
      summary: Upload a receipt (multipart field "file")
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/Attachment" } } } }
        "413": { description: Too large }
        "415": { description: Unsupported file type }
  /attachments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Attachments]
      summary: Download the file
      responses:
        "200": { description: The file, content: { image/jpeg: {}, image/png: {}, application/pdf: {} } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Attachments]
      summary: Delete a receipt
      responses:
        "204": { description: Deleted }

  # ---------------------------------------------------------------- Transfers
  /transfers:
    get:
      tags: [Transfers]
      summary: List transfers (X-Total-Count header)
      parameters:
        - { name: wallet_id, in: query, description: Sender or receiver, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transfer" } } } } }
    post:
      tags: [Transfers]
      summary: Move money between own wallets
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransferInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /transfers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Transfers]
      summary: Transfer detail
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
    put:
      tags: [Transfers]
      summary: Edit a transfer (fee 0 removes the fee)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransferInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
    delete:
      tags: [Transfers]
      summary: Delete a transfer and undo its balance changes
      responses:
        "204": { description: Deleted }

  # ---------------------------------------------------------------- Reports
  /reports/categories:
    get:
      tags: [Reports]
      summary: Totals per category with percentage of the type total (pie chart)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TransactionType" } }
        - { name: wallet_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, nullable: true }
                  to: { type: string, nullable: true }
                  income_total: { type: number }
                  expense_total: { type: number }
                  net: { type: number }
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        category_id: { type: integer }
                        category_name: { type: string }
                        icon: { type: string, nullable: true }
                        color: { type: string, nullable: true }
                        type: { $ref: "#/components/schemas/TransactionType" }
                        total: { type: number }
                        count: { type: integer }
                        percentage: { type: number }
  /reports/tags:
    get:
      tags: [Reports]
      summary: Income/expense per tag
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK }
  /reports/balances:
    get:
      tags: [Reports]
      summary: Active wallets and the total of all wallets
      responses:
        "200": { description: OK }
  /reports/monthly:
    get:
      tags: [Reports]
      summary: Income/expense/net per month (default the last 12 months)
      parameters:
        - { name: from, in: query, schema: { type: string, example: 2026-01 } }
        - { name: to, in: query, schema: { type: string, example: 2026-12 } }
        - { name: wallet_id, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /reports/daily:
    get:
      tags: [Reports]
      summary: One row per day of a month (calendar view)
      parameters:
        - $ref: "#/components/parameters/Month"
        - { name: wallet_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        income: { type: number }
                        expense: { type: number }
                        net: { type: number }
                        count: { type: integer }

  # ---------------------------------------------------------------- Budgets
  /budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      responses:
        "200": { description: OK }
    post:
      tags: [Budgets]
      summary: Create a monthly budget (omit category_id for an overall budget)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                category_id: { type: integer, nullable: true, description: Expense category }
                amount: { type: number, example: 1500000 }
      responses:
        "201": { description: Created }
        "409": { $ref: "#/components/responses/Conflict" }
  /budgets/status:
    get:
      tags: [Budgets]
      summary: Spent / remaining / status for every budget in a month
      parameters: [{ $ref: "#/components/parameters/Month" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  budgets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        category_id: { type: integer, nullable: true }
                        category_name: { type: string, nullable: true }
                        amount: { type: number }
                        spent: { type: number }
                        remaining: { type: number, description: Negative when over budget }
                        percentage: { type: number }
                        status: { type: string, enum: [ok, warning, over], description: warning from 80% }
                        days_left: { type: integer }
                        daily_allowance: { type: number, description: What can still be spent per day }
  /budgets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [Budgets], summary: Budget detail, responses: { "200": { description: OK } } }
    put:
      tags: [Budgets]
      summary: Change the amount
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount], properties: { amount: { type: number } } } } }
      responses: { "200": { description: OK } }
    delete: { tags: [Budgets], summary: Delete, responses: { "204": { description: Deleted } } }

  # ---------------------------------------------------------------- Recurring
  /recurring:
    get:
      tags: [Recurring]
      summary: List recurring rules
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RecurringRule" } } } } }
    post:
      tags: [Recurring]
      summary: Create a rule (a past start_date catches up immediately when auto_create)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecurringRuleInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringRule" } } } }
  /recurring/due:
    get:
      tags: [Recurring]
      summary: Occurrences waiting for confirmation, and what is coming up
      parameters: [{ name: days, in: query, description: "Look-ahead for upcoming (default 7)", schema: { type: integer } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: string, format: date }
                  due: { type: array, items: { $ref: "#/components/schemas/RecurringRule" } }
                  upcoming: { type: array, items: { $ref: "#/components/schemas/RecurringRule" } }
  /recurring/run:
    post:
      tags: [Recurring]
      summary: Create all due auto-create occurrences now (the server also does this every 10 minutes)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { created: { type: integer } } } } } }
  /recurring/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [Recurring], summary: Rule detail, responses: { "200": { description: OK } } }
    put:
      tags: [Recurring]
      summary: Edit a rule (a changed schedule restarts from today, without back-filling)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecurringRuleInput" } } }
      responses: { "200": { description: OK } }
    delete: { tags: [Recurring], summary: Delete (created transactions stay), responses: { "204": { description: Deleted } } }
  /recurring/{id}/confirm:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Recurring]
      summary: Create the next occurrence now, optionally with a different amount/date/note
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                transaction_date: { type: string, format: date }
                note: { type: string, nullable: true }
      responses: { "201": { description: "{ transaction, rule }" } }
  /recurring/{id}/skip:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [Recurring], summary: Skip the next occurrence, responses: { "200": { description: OK } } }
  /recurring/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [Recurring], summary: Pause, responses: { "200": { description: OK } } }
  /recurring/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [Recurring], summary: Resume (creates what was missed, if auto_create), responses: { "200": { description: OK } } }

  # ---------------------------------------------------------------- Goals
  /goals:
    get:
      tags: [Goals]
      summary: List goals with progress
      parameters: [{ $ref: "#/components/parameters/IncludeArchived" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Goal" } } } } }
    post:
      tags: [Goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target_amount]
              properties:
                name: { type: string, example: Laptop }
                target_amount: { type: number, example: 15000000 }
                target_date: { type: string, format: date, nullable: true }
                icon: { type: string }
                color: { type: string }
                initial_amount: { type: number }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
  /goals/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [Goals], summary: Goal detail, responses: { "200": { description: OK } } }
    put: { tags: [Goals], summary: Edit name/target/date/icon/color, responses: { "200": { description: OK } } }
    delete: { tags: [Goals], summary: Delete, responses: { "204": { description: Deleted } } }
  /goals/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [Goals], summary: Archive, responses: { "200": { description: OK } } }
  /goals/{id}/unarchive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [Goals], summary: Unarchive, responses: { "200": { description: OK } } }
  /goals/{id}/contributions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [Goals], summary: List deposits/withdrawals, responses: { "200": { description: OK } } }
    post:
      tags: [Goals]
      summary: Deposit or withdraw (earmarking only, no balance changes) → the updated goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
                type: { type: string, enum: [deposit, withdraw], default: deposit }
                contribution_date: { type: string, format: date }
                note: { type: string }
      responses: { "201": { description: OK } }
  /goals/{id}/contributions/{contributionId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: contributionId, in: path, required: true, schema: { type: integer } }
    delete: { tags: [Goals], summary: Delete a contribution → the updated goal, responses: { "200": { description: OK } } }

  # ---------------------------------------------------------------- Debts
  /debts:
    get:
      tags: [Debts]
      summary: List debts
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [payable, receivable] } }
        - { name: status, in: query, description: open includes overdue, schema: { type: string, enum: [open, settled, overdue] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Debt" } } } } }
    post:
      tags: [Debts]
      summary: Record a debt (with wallet_id the borrowed/lent money moves in/out of that wallet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, counterparty, amount]
              properties:
                direction: { type: string, enum: [payable, receivable], description: "payable = I owe, receivable = they owe me" }
                counterparty: { type: string, example: Budi }
                amount: { type: number }
                debt_date: { type: string, format: date }
                due_date: { type: string, format: date, nullable: true }
                note: { type: string }
                wallet_id: { type: integer, nullable: true }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Debt" } } } }
  /debts/summary:
    get:
      tags: [Debts]
      summary: What I still owe vs what is owed to me
      responses: { "200": { description: OK } }
  /debts/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [Debts], summary: Debt detail with payments, responses: { "200": { description: OK } } }
    put:
      tags: [Debts]
      summary: Edit counterparty, amount (≥ repaid), due_date, note
      responses: { "200": { description: OK } }
    delete: { tags: [Debts], summary: Delete and undo all its balance changes, responses: { "204": { description: Deleted } } }
  /debts/{id}/payments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Debts]
      summary: Record a repayment → the updated debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
                payment_date: { type: string, format: date }
                wallet_id: { type: integer, nullable: true }
                note: { type: string }
      responses: { "201": { description: OK } }
  /debts/{id}/payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: paymentId, in: path, required: true, schema: { type: integer } }
    delete: { tags: [Debts], summary: Delete a repayment → the updated debt, responses: { "200": { description: OK } } }

  # ---------------------------------------------------------------- Tags
  /tags:
    get: { tags: [Tags], summary: List tags with usage_count, responses: { "200": { description: OK } } }
    post:
      tags: [Tags]
      summary: Create a tag (tags are also created automatically from transactions)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, color: { type: string } } } } }
      responses: { "201": { description: Created } }
  /tags/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put: { tags: [Tags], summary: Rename / recolor, responses: { "200": { description: OK } } }
    delete: { tags: [Tags], summary: Delete (removes it from transactions), responses: { "204": { description: Deleted } } }

  # ---------------------------------------------------------------- Insights & quick input
  /insights:
    get:
      tags: [Insights]
      summary: Observations about a month (spending pace, budgets, goals, debts…)
      parameters: [{ $ref: "#/components/parameters/Month" }]
      responses:
        "200":
          description: Warnings first
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  insights:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, example: budget_over }
                        tone: { type: string, enum: [positive, warning, neutral] }
                        title: { type: string }
                        message: { type: string, example: "You're Rp 30.000 over your Food & Drinks budget." }
                        data: { type: object }
  /quick-input/parse:
    post:
      tags: [Quick input]
      summary: Turn "lunch 25k gopay" into a transaction draft (nothing is saved)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, example: "makan siang 25k gopay kemarin" } } } } }
      responses:
        "200":
          description: Draft
          content: { application/json: { schema: { $ref: "#/components/schemas/QuickDraft" } } }
  /quick-input/receipt:
    post:
      tags: [Quick input]
      summary: Scan a receipt (struk) or invoice (photo or PDF) into a transaction draft (nothing is saved)
      description: |
        Reads a photo with local OCR (PaddleOCR service when running, else Tesseract; free, never leaves the server), or a PDF from its text
        layer (scanned PDFs without text are refused with 422), and finds the total
        (GRAND TOTAL / TOTAL TAGIHAN / AMOUNT DUE / BALANCE DUE / TOTAL, else paid minus change), the date (the
        invoice date, never the due date), the shop or seller name (not the Bill To buyer) and the
        payment method. The draft uses the shop name for the category (Indomaret → Groceries) and the payment
        method for the wallet (a wallet named QRIS/GoPay/BCA…, or your cash wallet for TUNAI). Save it with
        POST /transactions, then attach the photo with POST /transactions/{id}/attachments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: "JPEG, PNG or WebP photo, or a PDF invoice; max 5 MB" }
      responses:
        "200":
          description: What was read, and a draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [receipt, invoice] }
                  text: { type: string, description: Raw OCR or PDF text (max 3000 characters) }
                  engine:
                    type: string
                    enum: [paddleocr, tesseract, pdf-text]
                    description: Which reader produced the text. tesseract is the weak fallback used when the PaddleOCR service isn't running; worth double-checking the amount.
                  merchant: { type: string, nullable: true, example: Indomaret }
                  total: { type: number, nullable: true, example: 40000 }
                  date: { type: string, format: date, nullable: true }
                  payment: { type: string, nullable: true, example: QRIS }
                  items:
                    type: array
                    description: What was bought, line by line (name and line amount); empty when the receipt lists none
                    items:
                      type: object
                      properties:
                        name: { type: string, example: Indomie Goreng }
                        amount: { type: number, example: 9300 }
                  draft: { $ref: "#/components/schemas/QuickDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Photo too large, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: Not a JPEG/PNG/WebP image or PDF, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Empty file, no readable text (blurry, scanned PDF, not a receipt), or a damaged PDF", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: OCR failed (e.g. language data could not be downloaded on the first scan), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /quick-input/voice:
    post:
      tags: [Quick input]
      summary: Speak it instead — a short recording becomes transcript + drafts (nothing is saved)
      description: |
        The app records a clip (m4a from expo-audio) and uploads it. The server transcribes it with the
        speech-to-text API configured in .env (STT_API_KEY, STT_API_URL, STT_MODEL, STT_LANGUAGE — Indonesian
        by default, English words are fine), then runs the same parser as /quick-input/parse. Spoken amounts
        ("dua puluh lima ribu", "goceng") are understood. A list such as "kopi 25 ribu, parkir goceng" gives one
        draft per item; a date said once ("kemarin") applies to every item. Save each draft with POST /transactions.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: "Max 3 MB. audio/* (m4a, aac, mp3, wav, webm, ogg)" }
      responses:
        "200":
          description: Transcript and drafts
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcript: { type: string, example: "Makan 25 ribu pakai GoPay kemarin." }
                  drafts: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/QuickDraft" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Recording too large, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: Not an audio file, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Empty recording, or nothing was heard (silence, noise)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: The speech-to-text service failed or is unreachable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Voice input is not configured on the server (no STT_API_KEY), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- Export
  /export/transactions.xlsx:
    get:
      tags: [Export]
      summary: Excel workbook (.xlsx) of transactions
      description: |
        One sheet, oldest first: Date (a real date), Type (In/Out), Category, Wallet, Note, Amount (number;
        In positive, Out negative, so SUM gives the change in balance), Kind (Entry/Transfer/Transfer fee/Debt), Tags.
        Bold header row stays visible while scrolling and has filters. Opening balances are included as In entries.
      parameters: &exportFilters
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: wallet_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TransactionType" } }
        - { name: q, in: query, description: Search in note and category name, schema: { type: string } }
      responses:
        "200": { description: Excel file, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {} } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /export/transactions.csv:
    get:
      tags: [Export]
      summary: CSV for Excel / Google Sheets
      parameters: *exportFilters
      responses: { "200": { description: CSV file, content: { text/csv: {} } } }
  /export/monthly-report.html:
    get:
      tags: [Export]
      summary: Printable monthly report (turn into PDF with expo-print)
      parameters: [{ $ref: "#/components/parameters/Month" }]
      responses: { "200": { description: HTML page, content: { text/html: {} } } }

  # ---------------------------------------------------------------- Sync
  /sync/changes:
    get:
      tags: [Sync]
      summary: Everything changed since the last sync (or a full snapshot)
      description: >-
        Store `server_time` and send it as `since` next time. Rows may arrive twice around the boundary;
        upsert them by id. `deleted` lists removed rows as { entity, id, deleted_at }.
      parameters: [{ name: since, in: query, schema: { type: string, format: date-time } }]
      responses: { "200": { description: "{ server_time, full, wallets, categories, transactions, transfers, budgets, recurring_rules, goals, goal_contributions, debts, debt_payments, tags, attachments, deleted }" } }

  # ---------------------------------------------------------------- Notifications
  /notifications/tokens:
    post:
      tags: [Notifications]
      summary: Register this phone's Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, example: "ExponentPushToken[xxxxxxxx]" }
                platform: { type: string, enum: [ios, android, web] }
      responses: { "201": { description: Registered } }
  /notifications/tokens/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    delete: { tags: [Notifications], summary: Unregister (call on logout), responses: { "204": { description: Removed } } }
  /notifications/settings:
    get: { tags: [Notifications], summary: Daily reminder settings, responses: { "200": { description: OK } } }
    put:
      tags: [Notifications]
      summary: Turn the daily "did you log anything?" reminder on/off and pick its time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reminder_enabled: { type: boolean }
                reminder_time: { type: string, example: "20:00" }
      responses: { "200": { description: OK } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
    Offset: { name: offset, in: query, schema: { type: integer, default: 0 } }
    Month: { name: month, in: query, description: "YYYY-MM (default: this month)", schema: { type: string, example: 2026-10 } }
    IncludeArchived: { name: include_archived, in: query, schema: { type: boolean, default: false } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Unique per user action; reuse it when retrying the same request.
      schema: { type: string, example: 3f0f6c1e-5a52-4f7e-9d0e-4b8e1c2a7d11 }

  responses:
    Session:
      description: Logged in
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: "#/components/schemas/User" }
              token: { type: string, description: "Send as Authorization: Bearer <token>" }
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing, wrong or expired login
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflicts with existing data (e.g. still in use, already exists)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Wallet not found }
    TransactionType: { type: string, enum: [income, expense] }
    QuickDraft:
      type: object
      properties:
        amount: { type: number, nullable: true }
        type: { $ref: "#/components/schemas/TransactionType" }
        category_id: { type: integer, nullable: true }
        category_name: { type: string, nullable: true }
        wallet_id: { type: integer, nullable: true }
        wallet_name: { type: string, nullable: true }
        transaction_date: { type: string, format: date }
        note: { type: string, nullable: true }
        matched: { type: object, description: How each field was decided (history/name/keyword/default…) }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        timezone: { type: string, example: Asia/Jakarta }
        reminder_enabled: { type: boolean }
        reminder_time: { type: string, example: "20:00" }
        created_at: { type: string, format: date-time }
    WalletInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: BCA }
        wallet_type: { type: string, enum: [cash, bank, ewallet, savings, other], default: other }
        icon: { type: string, nullable: true, example: bank }
        color: { type: string, nullable: true, example: "#5B8DB8" }
    Wallet:
      allOf:
        - $ref: "#/components/schemas/WalletInput"
        - type: object
          properties:
            id: { type: integer }
            balance: { type: number }
            archived_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, example: Food & Drinks }
        type: { $ref: "#/components/schemas/TransactionType" }
        icon: { type: string, nullable: true, example: utensils, description: "An icon key (lowercase, digits, dashes) or one emoji such as 🍜" }
        color: { type: string, nullable: true, example: "#F4A259" }
    Category:
      allOf:
        - $ref: "#/components/schemas/CategoryInput"
        - type: object
          properties:
            id: { type: integer }
            system_key: { type: string, nullable: true, enum: [opening_balance, transfer_fee, null] }
            archived_at: { type: string, format: date-time, nullable: true }
    TransactionInput:
      type: object
      required: [wallet_id, category_id, type, amount, transaction_date]
      properties:
        wallet_id: { type: integer }
        category_id: { type: integer }
        type: { $ref: "#/components/schemas/TransactionType" }
        amount: { type: number, example: 25000 }
        transaction_date: { type: string, format: date }
        note: { type: string, nullable: true }
        tags: { type: array, items: { type: string }, example: [bali-trip] }
    Transaction:
      type: object
      properties:
        id: { type: integer }
        wallet_id: { type: integer }
        wallet_name: { type: string }
        category_id: { type: integer, nullable: true }
        category_name: { type: string, nullable: true }
        category_icon: { type: string, nullable: true }
        category_color: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/TransactionType" }
        amount: { type: number }
        note: { type: string, nullable: true }
        transaction_date: { type: string, format: date }
        origin: { type: string, enum: [manual, transfer, transfer_fee, debt] }
        transfer_id: { type: integer, nullable: true }
        debt_id: { type: integer, nullable: true }
        recurring_rule_id: { type: integer, nullable: true }
        tags: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, color: { type: string, nullable: true } } } }
        attachment_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { type: integer }
        transaction_id: { type: integer }
        original_name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
    TransferInput:
      type: object
      required: [from_wallet_id, to_wallet_id, amount, transfer_date]
      properties:
        from_wallet_id: { type: integer }
        to_wallet_id: { type: integer }
        amount: { type: number }
        fee: { type: number, default: 0, description: Admin fee paid by the sending wallet }
        transfer_date: { type: string, format: date }
        note: { type: string, nullable: true }
    Transfer:
      allOf:
        - $ref: "#/components/schemas/TransferInput"
        - type: object
          properties:
            id: { type: integer }
            from_wallet_name: { type: string }
            to_wallet_name: { type: string }
            from_transaction_id: { type: integer }
            to_transaction_id: { type: integer }
            fee_transaction_id: { type: integer, nullable: true }
    RecurringRuleInput:
      type: object
      required: [wallet_id, category_id, type, amount, frequency, start_date]
      properties:
        wallet_id: { type: integer }
        category_id: { type: integer }
        type: { $ref: "#/components/schemas/TransactionType" }
        amount: { type: number }
        note: { type: string, nullable: true }
        frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval_count: { type: integer, default: 1, description: "e.g. 2 + weekly = every 2 weeks" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        auto_create: { type: boolean, default: true, description: false = wait for confirm }
    RecurringRule:
      allOf:
        - $ref: "#/components/schemas/RecurringRuleInput"
        - type: object
          properties:
            id: { type: integer }
            next_date: { type: string, format: date, nullable: true, description: null = finished }
            occurrences_done: { type: integer }
            paused: { type: boolean }
            wallet_name: { type: string }
            category_name: { type: string }
    Goal:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        target_amount: { type: number }
        target_date: { type: string, format: date, nullable: true }
        saved_amount: { type: number }
        remaining: { type: number }
        progress: { type: number, description: 0–100 }
        completed: { type: boolean }
        overdue: { type: boolean }
        months_left: { type: integer, nullable: true }
        monthly_needed: { type: number, nullable: true }
    Debt:
      type: object
      properties:
        id: { type: integer }
        direction: { type: string, enum: [payable, receivable] }
        counterparty: { type: string }
        amount: { type: number }
        paid_amount: { type: number }
        remaining: { type: number }
        status: { type: string, enum: [open, overdue, settled] }
        debt_date: { type: string, format: date }
        due_date: { type: string, format: date, nullable: true }
        wallet_id: { type: integer, nullable: true }
        settled_at: { type: string, format: date-time, nullable: true }
