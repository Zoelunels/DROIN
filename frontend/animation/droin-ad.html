<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DROIN Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #120E0C; --ui: #F7F4ED; --muted: #9A948B; --accent: #F2953B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ui); font-family: Manrope, system-ui, sans-serif; overflow: hidden; }
  .stage { position: fixed; top: 0; left: 0; right: 0; bottom: 84px; display: grid; place-items: center; padding: 16px; }
  canvas {
    width: min(100%, calc((100vh - 116px) * 16 / 9)); aspect-ratio: 16 / 9; display: block;
    border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  .play {
    position: absolute; inset: 0; margin: auto; width: 168px; height: 168px; border-radius: 50%;
    border: 0; background: var(--accent); color: #2A1D18; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 20px 60px rgba(242,149,59,.45); transition: transform .2s;
    font: 800 15px Manrope, system-ui, sans-serif;
  }
  .play:hover { transform: scale(1.05); }
  .play svg { width: 54px; height: 54px; margin-left: 8px; }
  .play span { position: absolute; bottom: -38px; white-space: nowrap; color: var(--ui); opacity: .8; }
  .play[hidden] { display: none; }
  .controls {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    background: rgba(255,255,255,.06); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 8px 12px;
    width: min(860px, calc(100vw - 32px));
  }
  .controls button, .controls a {
    font: 700 13px Manrope, system-ui, sans-serif; color: var(--ui); text-decoration: none;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  .controls button:hover, .controls a:hover { border-color: var(--accent); }
  .controls button.on { background: var(--accent); border-color: var(--accent); color: #2A1D18; }
  .controls button:focus-visible, .controls a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .controls button:disabled { opacity: .5; cursor: progress; }
  .controls input[type=range] { flex: 1 1 140px; min-width: 60px; accent-color: var(--accent); }
  .time { font: 600 12px Manrope, system-ui, sans-serif; color: var(--muted); width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
  #status { font: 600 12px Manrope, system-ui, sans-serif; color: var(--muted); }
  @media (max-width: 800px) { .stage { bottom: 132px; } canvas { width: min(100%, calc((100vh - 164px) * 16 / 9)); } }
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv" width="1920" height="1080" aria-label="DROIN 15-second app spot"></canvas>
  <button class="play" id="bigPlay" aria-label="Play with sound">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>
    <span>Play with sound</span>
  </button>
</div>
<div class="controls">
  <button id="replay">Replay</button>
  <button id="play">Play</button>
  <button id="loop" class="on" aria-pressed="true" title="Loop (L)">⟳ Loop</button>
  <button id="mute" aria-pressed="false" title="Mute (M)">🔊 Sound</button>
  <input id="scrub" type="range" min="0" max="1500" value="0" aria-label="Timeline" />
  <span class="time" id="time">0.00 / 15.00</span>
  <button id="export" title="Render a 1080p60 MP4 with sound">⬇ Export MP4</button>
  <span id="status"></span>
  <a href="/">DROIN intro</a>
</div>

<script>
// =====================================================================================
//  DROIN — 15s spot. Everything is drawn on a 1920×1080 canvas from a single
//  renderFrame(t) function, so playback, scrubbing and MP4 export all produce the
//  exact same frames. Sound is synthesized with Web Audio from one event list.
// =====================================================================================
const W = 1920, H = 1080, DUR = 15, FPS = 60;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const COL = {
  ink: '#2A1D18', ink2: '#1A1310', cream: '#F7F4ED', cream2: '#EFE7D8', white: '#FFFDF8',
  orange: '#F2953B', orange2: '#E8A04A', deep: '#C8702C', peach: '#FAD7B7', panel: '#F8E4CB',
  gray: '#858078', green: '#6F8F72', red: '#C96A4A', blue: '#5B8DB8', pink: '#E07A8B', yellow: '#D9A441',
};

// ---------- math & easing ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const Ez = {
  lin: p => p,
  in2: p => p * p,
  in3: p => p * p * p,
  out2: p => 1 - (1 - p) ** 2,
  out3: p => 1 - (1 - p) ** 3,
  out5: p => 1 - (1 - p) ** 5,
  inOut3: p => (p < .5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2),
  outBack: p => { const c = 1.7, c3 = c + 1; return 1 + c3 * (p - 1) ** 3 + c * (p - 1) ** 2; },
  outBackBig: p => { const c = 2.8, c3 = c + 1; return 1 + c3 * (p - 1) ** 3 + c * (p - 1) ** 2; },
  outElastic: p => (p === 0 ? 0 : p === 1 ? 1 : 2 ** (-10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI / 3)) + 1),
};
const pr = (t, s, d) => clamp((t - s) / d);
const ez = (t, s, d, f = Ez.out3) => f(pr(t, s, d));
// A bump that rises and falls back to 0 (for squash, pulses).
const bump = (t, s, d) => { const p = pr(t, s, d); return p <= 0 || p >= 1 ? 0 : Math.sin(Math.PI * p) * (1 - p * .4); };
// Deterministic random so every render (and the export) is identical.
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const rp = n => (n < 0 ? '-' : '') + 'Rp ' + Math.abs(Math.round(n)).toLocaleString('id-ID');

// ---------- drawing helpers ----------
const font = (size, w = 800) => `${w} ${size}px Manrope, system-ui, sans-serif`;
function txt(s, x, y, size, color, { w = 800, align = 'left', base = 'alphabetic', alpha = 1, ls = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font(size, w); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = `${ls}px`;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, w = 800, ls = 0) {
  ctx.save(); ctx.font = font(size, w); if (ls) ctx.letterSpacing = `${ls}px`;
  const m = ctx.measureText(s).width; ctx.restore(); return m;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

// Minimal line icons, drawn in a 24×24 box centred on (x, y).
function glyph(name, x, y, s, color, lw = 2.2) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 24, s / 24);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  switch (name) {
    case 'food':
      ctx.moveTo(-5, -9); ctx.lineTo(-5, 9); ctx.moveTo(-8, -9); ctx.lineTo(-8, -3); ctx.quadraticCurveTo(-8, 0, -5, 0);
      ctx.quadraticCurveTo(-2, 0, -2, -3); ctx.lineTo(-2, -9); ctx.moveTo(5, 9); ctx.lineTo(5, -9);
      ctx.quadraticCurveTo(9.5, -6, 8.5, 1); ctx.lineTo(5, 1); ctx.stroke(); break;
    case 'bus':
      ctx.roundRect(-8, -9, 16, 15, 3); ctx.moveTo(-8, -1); ctx.lineTo(8, -1); ctx.moveTo(-5, 6); ctx.lineTo(-5, 9);
      ctx.moveTo(5, 6); ctx.lineTo(5, 9); ctx.stroke(); break;
    case 'bag':
      ctx.roundRect(-8, -4, 16, 13, 3); ctx.moveTo(-4, -4); ctx.quadraticCurveTo(-4, -10, 0, -10);
      ctx.quadraticCurveTo(4, -10, 4, -4); ctx.stroke(); break;
    case 'coffee':
      ctx.moveTo(-8, -3); ctx.lineTo(-7, 8); ctx.lineTo(5, 8); ctx.lineTo(6, -3); ctx.closePath();
      ctx.moveTo(6, -1); ctx.quadraticCurveTo(11, -1, 10, 3); ctx.quadraticCurveTo(9, 6, 5.5, 5);
      ctx.moveTo(-3, -6); ctx.quadraticCurveTo(-5, -8, -3, -10); ctx.moveTo(1, -6); ctx.quadraticCurveTo(-1, -8, 1, -10); ctx.stroke(); break;
    case 'salary':
      ctx.roundRect(-9, -4, 18, 13, 2.5); ctx.moveTo(-3, -4); ctx.lineTo(-3, -7); ctx.lineTo(3, -7); ctx.lineTo(3, -4);
      ctx.moveTo(-9, 2); ctx.lineTo(9, 2); ctx.stroke(); break;
    case 'bolt':
      ctx.moveTo(2, -10); ctx.lineTo(-6, 2); ctx.lineTo(0, 2); ctx.lineTo(-2, 10); ctx.lineTo(6, -2); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill(); break;
    case 'plane':
      ctx.moveTo(-9, 0); ctx.lineTo(9, -7); ctx.lineTo(3, 8); ctx.lineTo(0, 2); ctx.closePath(); ctx.moveTo(0, 2); ctx.lineTo(9, -7); ctx.stroke(); break;
    case 'laptop':
      ctx.roundRect(-7, -7, 14, 10, 1.5); ctx.moveTo(-10, 6); ctx.lineTo(10, 6); ctx.stroke(); break;
    case 'shield':
      ctx.moveTo(0, -9); ctx.lineTo(8, -6); ctx.lineTo(7, 2); ctx.quadraticCurveTo(5, 7, 0, 10); ctx.quadraticCurveTo(-5, 7, -7, 2);
      ctx.lineTo(-8, -6); ctx.closePath(); ctx.stroke(); break;
    case 'ticket':
      ctx.roundRect(-9, -6, 18, 12, 2); ctx.moveTo(2, -6); ctx.lineTo(2, 6); ctx.stroke(); break;
    case 'home':
      ctx.moveTo(-9, 0); ctx.lineTo(0, -8); ctx.lineTo(9, 0); ctx.moveTo(-6, -2); ctx.lineTo(-6, 8); ctx.lineTo(6, 8); ctx.lineTo(6, -2); ctx.stroke(); break;
    case 'pie':
      ctx.arc(0, 0, 8.5, 0, Math.PI * 2); ctx.moveTo(0, 0); ctx.lineTo(0, -8.5); ctx.moveTo(0, 0); ctx.lineTo(8.5, 0); ctx.stroke(); break;
    case 'target':
      ctx.arc(0, 0, 8.5, 0, Math.PI * 2); ctx.moveTo(4.5, 0); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.stroke(); circle(0, 0, 1.6); ctx.fill(); break;
    case 'user':
      ctx.arc(0, -4, 4, 0, Math.PI * 2); ctx.moveTo(-8, 9); ctx.quadraticCurveTo(-8, 2, 0, 2); ctx.quadraticCurveTo(8, 2, 8, 9); ctx.stroke(); break;
    case 'wallet':
      ctx.roundRect(-9, -6, 18, 14, 3); ctx.moveTo(9, -1); ctx.lineTo(3, -1); ctx.lineTo(3, 4); ctx.lineTo(9, 4); ctx.stroke(); break;
    case 'cal':
      ctx.roundRect(-8, -7, 16, 15, 2.5); ctx.moveTo(-8, -2); ctx.lineTo(8, -2); ctx.moveTo(-4, -10); ctx.lineTo(-4, -6);
      ctx.moveTo(4, -10); ctx.lineTo(4, -6); ctx.stroke(); break;
    case 'plus':
      ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.stroke(); break;
    case 'up':
      ctx.moveTo(-6, 4); ctx.lineTo(0, -3); ctx.lineTo(3, 1); ctx.lineTo(8, -5); ctx.moveTo(4, -5); ctx.lineTo(8, -5); ctx.lineTo(8, -1); ctx.stroke(); break;
    case 'spark':
      ctx.moveTo(0, -10); ctx.quadraticCurveTo(1, -1, 10, 0); ctx.quadraticCurveTo(1, 1, 0, 10); ctx.quadraticCurveTo(-1, 1, -10, 0);
      ctx.quadraticCurveTo(-1, -1, 0, -10); ctx.fill(); break;
  }
  ctx.restore();
}
function iconCircle(x, y, r, bg, name, fg = COL.white) {
  circle(x, y, r); ctx.fillStyle = bg; ctx.fill();
  glyph(name, x, y, r * 1.05, fg, 2.4);
}
// Tiny flat drawer mascot (app icon / toast).
function miniDrawer(x, y, s, happy = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-17, -14, 34, 28, 8); ctx.fillStyle = COL.orange; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke();
  rr(-12, -5, 26, 17, 5); ctx.fillStyle = COL.panel; ctx.fill(); ctx.stroke();
  ctx.fillStyle = COL.ink;
  if (happy > .5) {
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, 3); ctx.quadraticCurveTo(-4, 0, -2, 3); ctx.moveTo(4, 3); ctx.quadraticCurveTo(6, 0, 8, 3); ctx.stroke();
  } else { circle(-4, 2.5, 1.8); ctx.fill(); circle(6, 2.5, 1.8); ctx.fill(); }
  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-1, 6.5); ctx.quadraticCurveTo(1, 9, 3, 6.5); ctx.stroke();
  ctx.restore();
}

// ---------- the coin / "O" ----------
function drawCoin(x, y, r, spin = 0, o = {}) {
  const c = Math.cos(spin), sn = Math.sin(spin);
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); ctx.globalAlpha *= o.alpha ?? 1;
  const rx = Math.max(.6, r * Math.abs(c)), dx = -r * .17 * sn;
  ctx.fillStyle = COL.orange;
  ctx.beginPath(); ctx.ellipse(dx, 0, rx, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(Math.min(0, dx), -r, Math.abs(dx), 2 * r);
  ctx.fillStyle = o.color || COL.ink;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, r, 0, 0, Math.PI * 2); ctx.fill();
  if (c > .05) {
    ctx.scale(c, 1);
    if (o.face) {
      ctx.fillStyle = COL.panel;
      ctx.beginPath(); ctx.ellipse(-.42 * r, -.14 * r, .13 * r, .13 * r * (o.blink ?? 1), 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(.42 * r, -.14 * r, .13 * r, .13 * r * (o.blink ?? 1), 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = COL.panel; ctx.lineWidth = .17 * r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-.24 * r, .16 * r); ctx.quadraticCurveTo(0, .48 * r, .24 * r, .16 * r); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(248,228,203,.35)'; ctx.lineWidth = .08 * r;
      circle(0, 0, .72 * r); ctx.stroke();
      glyph('spark', 0, 0, r * .7, 'rgba(248,228,203,.55)');
    }
  }
  ctx.restore();
}

// ---------- the drawer mascot (same geometry as the DROIN intro) ----------
const DT = -0.2126;
const sk = (x, y) => [x, y + DT * x];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
const vmul = (a, k) => [a[0] * k, a[1] * k];
const mapObj = (o, f) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, f(v)]));
const DD = [-110, -80], DPT = vmul(DD, .2), DOPEN = [95, 70];
const DF = { TL: sk(-150, -95), TR: sk(150, -95), BL: sk(-150, 95), BR: sk(150, 95) };
const dbf = mapObj(DF, p => vadd(p, DPT)), dbb = mapObj(DF, p => vadd(p, DD));
const dtr = { TL: vadd(sk(-138, -86), DPT), TR: vadd(sk(138, -86), DPT), BL: vadd(sk(-138, 86), DPT) };
const polyStr = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + 'Z';
function roundPolyStr(pts, r) {
  const n = pts.length; let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i + n - 1) % n], b = pts[(i + 1) % n];
    const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const q = Math.min(r, la / 2, lb / 2);
    const p1 = [p[0] + (a[0] - p[0]) / la * q, p[1] + (a[1] - p[1]) / la * q];
    const p2 = [p[0] + (b[0] - p[0]) / lb * q, p[1] + (b[1] - p[1]) / lb * q];
    d += (i ? 'L' : 'M') + p1.join(',') + 'Q' + p.join(',') + ' ' + p2.join(',');
  }
  return d + 'Z';
}
const P_SIL = new Path2D(roundPolyStr([dbb.TL, dbb.TR, dbf.TR, dbf.BR, dbf.BL, dbb.BL], 30));
const P_TOP = new Path2D(polyStr([dbb.TL, dbb.TR, dbf.TR, dbf.TL]));
const P_LEFT = new Path2D(polyStr([dbb.TL, dbf.TL, dbf.BL, dbb.BL]));
const P_FRONT = new Path2D(polyStr([dbf.TL, dbf.TR, dbf.BR, dbf.BL]));
const P_HILITE = new Path2D(polyStr([sk(-150, -50), sk(-150, 60), vadd(sk(-150, 60), vmul(DPT, .75)), vadd(sk(-150, -50), vmul(DPT, .75))]));

function drawerXf(st) {
  ctx.translate(st.x, st.y + 127 * st.s);
  ctx.scale(st.s * (st.sx ?? 1), st.s * (st.sy ?? 1));
  ctx.translate(0, -127);
}
function drawerToWorld(st, p) {
  return [st.x + p[0] * st.s * (st.sx ?? 1), st.y + 127 * st.s + (p[1] - 127) * st.s * (st.sy ?? 1)];
}
function drawerBack(st) {
  ctx.save(); drawerXf(st);
  ctx.fillStyle = 'rgba(42,29,24,.13)'; ctx.beginPath(); ctx.ellipse(-40, 142, 225, 17, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.clip(P_SIL);
  ctx.fillStyle = COL.orange; ctx.fill(P_TOP);
  ctx.fillStyle = COL.deep; ctx.fill(P_LEFT);
  ctx.fillStyle = COL.ink; ctx.fill(P_FRONT);
  ctx.restore();
  ctx.lineWidth = 14; ctx.lineJoin = 'round'; ctx.strokeStyle = COL.ink; ctx.stroke(P_SIL);
  const k = st.k || 0;
  if (k > .01) {
    const ov = vmul(DOPEN, k), tl2 = vadd(dtr.TL, ov), tr2 = vadd(dtr.TR, ov), bl2 = vadd(dtr.BL, ov);
    ctx.lineWidth = 12;
    const left = new Path2D(polyStr([dtr.TL, tl2, bl2, dtr.BL]));
    ctx.fillStyle = COL.deep; ctx.fill(left); ctx.stroke(left);
    const open = new Path2D(polyStr([dtr.TL, dtr.TR, tr2, tl2]));
    const g = ctx.createLinearGradient(dtr.TL[0], dtr.TL[1], tl2[0] + 60, tl2[1] + 40);
    g.addColorStop(0, '#1E120D'); g.addColorStop(1, '#7A5038');
    ctx.fillStyle = g; ctx.fill(open); ctx.stroke(open);
  }
  ctx.restore();
}
function drawerFront(st) {
  ctx.save(); drawerXf(st);
  ctx.save();
  const ov = vmul(DOPEN, st.k || 0); ctx.translate(ov[0], ov[1]);
  for (const k of [1, .8, .6, .4, .2]) {
    ctx.save(); ctx.translate(DPT[0] * k, DPT[1] * k); ctx.transform(1, DT, 0, 1, 0, 0);
    rr(-150, -95, 300, 190, 38); ctx.fillStyle = COL.ink; ctx.fill(); ctx.lineWidth = 14; ctx.strokeStyle = COL.ink; ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#FFF3E2'; ctx.fill(P_HILITE);
  ctx.transform(1, DT, 0, 1, 0, 0);
  rr(-150, -95, 300, 190, 38); ctx.fillStyle = COL.panel; ctx.fill(); ctx.lineWidth = 14; ctx.strokeStyle = COL.ink; ctx.stroke();
  // face
  const lx = st.lx || 0, ly = st.ly || 0, happy = st.happy || 0, mouth = st.mouth || 0;
  ctx.fillStyle = COL.ink; ctx.strokeStyle = COL.ink; ctx.lineCap = 'round';
  if (happy < .5) {
    const ry = Math.max(.8, 13 * (st.blink ?? 1));
    for (const ex of [-68, 68]) { ctx.beginPath(); ctx.ellipse(ex + lx, 4 + ly, 13, ry, 0, 0, Math.PI * 2); ctx.fill(); }
  } else {
    ctx.lineWidth = 11; ctx.beginPath();
    ctx.moveTo(-84, 10); ctx.quadraticCurveTo(-68, -10, -52, 10); ctx.moveTo(52, 10); ctx.quadraticCurveTo(68, -10, 84, 10); ctx.stroke();
  }
  if (mouth > .03) { ctx.beginPath(); ctx.ellipse(0, 34, 11 * mouth, 14 * mouth, 0, 0, Math.PI * 2); ctx.fill(); }
  else { ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(-22, 24); ctx.quadraticCurveTo(0, 48 + happy * 6, 22, 24); ctx.stroke(); }
  ctx.restore();
  // sparks
  const sp = st.sparks || 0;
  if (sp > .02) {
    ctx.strokeStyle = COL.orange; ctx.lineWidth = 22; ctx.lineCap = 'round';
    for (const [x1, y1, x2, y2] of [[168, -168, 160, -222], [196, -152, 236, -196]]) {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, sp), lerp(y1, y2, sp)); ctx.stroke();
    }
  }
  ctx.restore();
}
// Things that fall into the drawer are visible above the tray's back edge or inside the opening.
function drawerClip(st) {
  const k = st.k || 0;
  const a = drawerToWorld(st, dtr.TL), b = drawerToWorld(st, dtr.TR);
  const ov = vmul(DOPEN, k);
  const tl2 = drawerToWorld(st, vadd(dtr.TL, ov)), tr2 = drawerToWorld(st, vadd(dtr.TR, ov));
  const p = new Path2D();
  p.rect(-4000, -4000, 12000, 12000);
  p.addPath(new Path2D(polyStr([a, tl2, tr2, [Math.max(tr2[0], b[0]), 6000], [a[0], 6000]])));
  return p;
}
function trayCenter(st) {
  const ov = DOPEN;

const WM = {
  D: new Path2D('M162,318 V462 H236 C292,462 314,428 314,390 C314,352 292,318 236,318 Z'),
  R: new Path2D('M397,462 V318 H468 C508,318 528,342 528,368 C528,394 508,414 468,414 H397 M472,416 L526,462'),

const WM_CX = { D: 238, R: 462, I: 855, N: 1028 };
function drawWordmark(cx, cy, sc, t, t0, color = COL.ink) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-635, -390);
  ['D', 'R', 'O', 'I', 'N'].forEach((L, i) => {
    const s = t0 + i * .055, p = ez(t, s, .55, Ez.outBack), pa = pr(t, s, .12);
    if (pa <= 0) return;
    if (L === 'O') { drawCoin(695, 390 - (1 - p) * 220, 112, (1 - ez(t, s, .4, Ez.out3)) * Math.PI * 4, { face: true, alpha: pa }); return; }
    ctx.save(); ctx.globalAlpha *= pa;
    ctx.translate(WM_CX[L], 462 + (1 - p) * 160); ctx.scale(1, lerp(.5, 1, clamp(p * 1.4))); ctx.translate(-WM_CX[L], -462);
    ctx.lineWidth = 64; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color; ctx.stroke(WM[L]);
    ctx.restore();
  });
  const sp = ez(t, t0 + .38, .35, Ez.outBack);

}

function drawReceipt(x, y, s, rot, amount) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-34, -46); ctx.lineTo(34, -46); ctx.lineTo(34, 40);

  ctx.lineTo(-34, 40); ctx.closePath();
  ctx.fillStyle = COL.white; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(42,29,24,.25)'; ctx.stroke();
  ctx.fillStyle = 'rgba(42,29,24,.18)';
  for (let i = 0; i < 4; i++) ctx.fillRect(-22, -30 + i * 12, i === 3 ? 26 : 44, 4);
  if (amount) txt(amount, 0, 30, 13, COL.red, { align: 'center', w: 800 });
  ctx.restore();
}
function confetti(t, t0, x, y, n, seed, { spread = Math.PI * 1.2, speed = 900, up = -Math.PI / 2 } = {}) {
  const dt = t - t0; if (dt < 0 || dt > 1.8) return;
  const cols = [COL.orange, COL.ink, COL.peach, COL.green, COL.yellow, COL.blue];
  for (let i = 0; i < n; i++) {
    const r = rng(seed * 997 + i);
    const ang = up + (r() - .5) * spread, sp = speed * (.4 + r() * .8);
    const k = (1 - Math.exp(-3 * dt)) / 3;
    const px = x + Math.cos(ang) * sp * k, py = y + Math.sin(ang) * sp * k + 700 * dt * dt;
    ctx.save(); ctx.globalAlpha *= clamp(1.6 - dt); ctx.translate(px, py); ctx.rotate(r() * 6 + dt * (r() * 14 - 7));
    ctx.fillStyle = cols[i % cols.length];
    if (i % 3 === 0) { circle(0, 0, 6 + r() * 4); ctx.fill(); }
    else ctx.fillRect(-9, -4, 18, 8 + r() * 4);
    ctx.restore();
  }
}
function floatCard(x, y, w, h, rot, scale, alpha, draw, fill = COL.white) {
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.save(); ctx.shadowColor = 'rgba(42,29,24,.25)'; ctx.shadowBlur = 44; ctx.shadowOffsetY = 20;
  rr(-w / 2, -h / 2, w, h, 24); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  draw(-w / 2, -h / 2, w, h);
  ctx.restore();
}

const TYPED = 'lunch 25k gopay';

const typedCount = t => Math.floor(clamp((t - 6.72) / .052, 0, TYPED.length));
function sheetPos(t) { return ez(t, 6.4, .42, Ez.out5) - ez(t, 8.45, .3, Ez.in3); }
function quickSheet(t) {
  const sp = sheetPos(t); if (sp <= 0) return;
  ctx.fillStyle = `rgba(20,14,11,${.45 * sp})`; ctx.fillRect(0, 0, 390, 844);
  const y = 844 - 456 * sp;
  rr(0, y, 390, 520, 30); ctx.fillStyle = COL.white; ctx.fill();
  rr(175, y + 12, 40, 5, 3); ctx.fillStyle = 'rgba(42,29,24,.15)'; ctx.fill();
  txt('Put something in', 24, y + 58, 22, COL.ink, { w: 800 });
  txt('Type it like you say it', 24, y + 82, 13, COL.gray, { w: 600 });
  // input
  rr(16, y + 100, 358, 60, 16); ctx.fillStyle = COL.cream; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = COL.orange; ctx.stroke();
  const n = typedCount(t), parsed = ez(t, 7.55, .3);
  ctx.save(); ctx.font = font(20, 700); ctx.textBaseline = 'alphabetic';
  let x = 34;
  if (n === 0) { ctx.fillStyle = 'rgba(42,29,24,.3)'; ctx.fillText('e.g. lunch 25k gopay', x, y + 138); }
  const segs = [['lunch ', COL.ink], ['25k', COL.deep], [' ', COL.ink], ['gopay', '#2F8577']];
  let shown = 0;
  for (const [s, c] of segs) {
    const part = s.slice(0, Math.max(0, n - shown)); shown += s.length;
    if (!part) continue;
    const wpart = ctx.measureText(part).width;
    if (parsed > 0 && c !== COL.ink) { rr(x - 3, y + 116, wpart + 6, 30, 7); ctx.fillStyle = c === COL.deep ? `rgba(242,149,59,${.22 * parsed})` : `rgba(62,156,142,${.2 * parsed})`; ctx.fill(); }
    ctx.fillStyle = parsed > 0 ? c : COL.ink; ctx.fillText(part, x, y + 138); x += wpart;
  }
  if ((n < TYPED.length || Math.floor(t * 3) % 2 === 0) && t < 8.4) { ctx.fillStyle = COL.orange; ctx.fillRect(x + 2, y + 118, 2.5, 26); }
  ctx.restore();
  // chips
  let cx = 16, cy = y + 182;
  CHIPS.forEach((c, i) => {
    const w = measure(c.label, 14, 800) + (c.icon ? 46 : 28);
    if (cx + w > 374) { cx = 16; cy += 46; }
    const p = ez(t, 7.58 + i * .08, .45, Ez.outBack);
    if (p > 0) {
      ctx.save(); ctx.translate(cx + w / 2, cy + 17); ctx.scale(p, p); ctx.translate(-cx - w / 2, -cy - 17);
      rr(cx, cy, w, 36, 18); ctx.fillStyle = c.bg; ctx.fill();
      if (c.icon) glyph(c.icon, cx + 21, cy + 18, 17, COL.ink, 2.4);
      txt(c.label, cx + (c.icon ? 36 : 14), cy + 23, 14, COL.ink, { w: 800 });
      ctx.restore();
    }
    cx += w + 8;
  });
  // CTA
  const press = bump(t, 8.35, .2);
  ctx.save(); ctx.translate(195, y + 319); ctx.scale(1 - .05 * press, 1 - .05 * press); ctx.translate(-195, -(y + 319));
  rr(16, y + 290, 358, 58, 18); ctx.fillStyle = COL.orange; ctx.fill();
  txt('Put something in', 195, y + 326, 17, COL.ink, { w: 800, align: 'center' });
  ctx.restore();
  tapRing(260, y + 319, t, 8.35);
}

  const dest = actx.createMediaStreamDestination();
  const stream = cv.captureStream(FPS);
  if (!muted) dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm', videoBitsPerSecond: 12_000_000 });
  const parts = []; rec.ondataavailable = e => parts.push(e.data);
  const done = new Promise(r => (rec.onstop = r));
  const g = actx.createGain(); g.connect(dest); g.connect(masterIn);
  scheduleAudio(actx, g, 0, actx.currentTime + .05);
  rec.start();
  const start = nowSec() + .05;
  await new Promise(resolve => {
    const tick = () => {
      const t = nowSec() - start;
      renderFrame(clamp(t, 0, DUR - 1e-4)); status(`Recording ${Math.round(clamp(t / DUR) * 100)}%`);
      if (t < DUR) requestAnimationFrame(tick); else resolve();
    };
    tick();
  });
  rec.stop(); await done; g.disconnect();
  const blob = new Blob(parts, { type: 'video/webm' });
  saveBlob(blob, 'droin-spot.webm');
  status(`Done — ${(blob.size / 1e6).toFixed(1)} MB (WebM)`);
}
$('export').onclick = exportVideo;

// Start on a poster frame once the font is ready.
document.fonts.load('800 100px Manrope').then(() => document.fonts.load('600 30px Manrope')).catch(() => {}).finally(() => {
  tNow = 5.6;
  requestAnimationFrame(frame);
});
window.__render = renderFrame;
</script>
